
[project]
name = "rag-using-langchain-langgraph-langsmith"
version = "1.0.0"
description = "End-to-end RAG implementation using LangChain, LangGraph and LangSmith"
readme = "README.md"

authors = [
    { name = "Chandan Chaudhari", email = "chaudhari.chandan22@gmail.com" }
]

requires-python = ">=3.12"

dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
]
